# Met à jour le serveur de la ligue (fonctions Supabase « tick » et « ligue ») à chaque publication du jeu.
# Nécessite le secret SUPABASE_ACCESS_TOKEN dans les réglages du dépôt (voir multijoueur/MULTIJOUEUR.md).
name: Serveur de ligue

on:
  push:
    branches: [main]
    paths:
      - 'moteur.js'
      - 'legendes.js'
      - 'carriere.js'
      - 'gazette.js'
      - 'gazette2.js'
      - 'ligue.js'
      - 'multijoueur/**'
      - 'supabase/**'
      - '.github/workflows/serveur.yml'
  workflow_dispatch:

jobs:
  serveur:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: gfsritybqwrkgujilser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assembler le moteur pour le serveur
        run: node multijoueur/construire.js
      - name: Vérifier la ligue et le serveur
        run: |
          node multijoueur/test_ligue.js
          node multijoueur/test_serveur.js --module
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publier les fonctions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Le secret SUPABASE_ACCESS_TOKEN n'est pas encore enregistré dans le dépôt."; exit 1; fi
          supabase functions deploy --remote="$PROJET" --yes
